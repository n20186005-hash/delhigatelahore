# pnpm 12 settings file (generated by pnpm install; kept in the repo so CI
# installs behave identically).
allowBuilds:
  # esbuild ships a platform binary; its postinstall is safe to allow.
  esbuild: true
  # workerd is only needed by the (currently unused) Cloudflare SSR adapter.
  workerd: false
minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.3.2'
  - astro@7.3.3
